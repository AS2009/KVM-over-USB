name: client_build_macos

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check-out repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt

      - name: Install Dependencies
        run: |
          pip install -r ./client/data/requirements_for_macos.txt
        shell: bash

      - name: Build with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          working-directory: ./client
          script-name: usb_kvm_client.py
          mode: app
          python-flag: |
            -u
            -O
          include-data-dir: |
            ./data=data
            ./icons=icons
            ./translations=translations
          enable-plugins: pyside6
          include-qt-plugins: multimedia
          macos-create-app-bundle: true
          quiet: true

      - name: Create DMG
        run: |
          APP_PATH=$(find ./client/build -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found in ./client/build/"
            ls -la ./client/build/
            exit 1
          fi
          echo "Found app bundle: $APP_PATH"

          APP_NAME=$(basename "$APP_PATH" .app)
          VERSION="${{ github.ref_name }}"
          DMG_NAME="${APP_NAME}_${VERSION}_macOS.dmg"
          STAGING="./dmg_staging"

          mkdir -p "$STAGING"
          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          echo "Creating DMG: $DMG_NAME"
          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            -imagekey zlib-level=9 \
            "dist/$DMG_NAME"

          echo "DMG created successfully:"
          ls -lh dist/
        shell: bash

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS_build
          path: dist/*.dmg
          include-hidden-files: true

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./download-artifact

      - name: Display structure of downloaded files
        run: ls -R ./download-artifact

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./download-artifact/**/*.dmg
          tag_name: ${{ github.ref_name }}
          body: "macOS DMG release of ${{ github.ref_name }}."
        env:
          GITHUB_TOKEN: ${{ secrets.PROJECT_TOKEN }}
