name: client_build_macos

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check-out repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: 'arm64'
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt

      - name: Install Dependencies
        run: |
          pip install -r ./client/data/requirements_for_macos.txt
        shell: bash

      - name: Build with Nuitka (standalone)
        working-directory: ./client
        run: |
          python -m nuitka \
            --mode=standalone \
            --python-flag=-u \
            --python-flag=-O \
            --enable-plugin=pyside6 \
            --include-qt-plugins=multimedia \
            --include-data-dir=./data=data \
            --include-data-dir=./icons=icons \
            --include-data-dir=./translations=translations \
            --output-dir=build \
            --assume-yes-for-downloads \
            --quiet \
            usb_kvm_client.py
        shell: bash

      - name: Create macOS .app Bundle
        run: |
          BUILD_DIR="./client/build/usb_kvm_client.dist"
          if [ ! -d "$BUILD_DIR" ]; then
            echo "Error: Nuitka output dir not found at $BUILD_DIR"
            ls -la ./client/build/
            exit 1
          fi
          python3 ./client/script/create_macos_app_bundle.py "$BUILD_DIR" "./client/build"
        shell: bash


      - name: Remove Quarantine & Code Sign .app
        run: |
          APP_PATH="./client/build/USB KVM Client.app"
          echo "Clearing quarantine xattr..."
          xattr -cr "${APP_PATH}" 2>/dev/null || true
          echo "Signing ${APP_PATH} with ad-hoc signature..."
          codesign --force --deep --sign - "${APP_PATH}"
          echo "Verifying signature:"
          codesign --verify --verbose "${APP_PATH}"
        shell: bash
      - name: Package as DMG
        run: |
          BUNDLE_NAME="USB KVM Client.app"
          APP_PATH="./client/build/${BUNDLE_NAME}"

          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle not found at $APP_PATH"
            ls -la ./client/build/
            exit 1
          fi

          VERSION="${{ github.ref_name }}"
          DMG_NAME="USB_KVM_Client_${VERSION}_macOS_arm64.dmg"
          STAGING_DIR="./dmg_staging"

          mkdir -p dist "$STAGING_DIR"
          cp -R "$APP_PATH" "$STAGING_DIR/"
          ln -sf /Applications "$STAGING_DIR/Applications"

          echo "Creating DMG: ${DMG_NAME}"
          hdiutil create \
            -volname "USB KVM Client" \
            -srcfolder "$STAGING_DIR" \
            -ov \
            -format UDZO \
            -imagekey zlib-level=9 \
            "dist/${DMG_NAME}"

          echo "DMG created: dist/${DMG_NAME} ($(du -sh "dist/${DMG_NAME}" | cut -f1))"
        shell: bash

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS_build
          path: dist/*.dmg
          include-hidden-files: true

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./download-artifact

      - name: Display structure of downloaded files
        run: ls -R ./download-artifact

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./download-artifact/**/*.dmg
          tag_name: ${{ github.ref_name }}
          body: "macOS DMG release of ${{ github.ref_name }}."
        env:
          GITHUB_TOKEN: ${{ secrets.PROJECT_TOKEN }}
