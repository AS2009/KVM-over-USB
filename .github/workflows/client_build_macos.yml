name: client_build_macos

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check-out repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: 'arm64'
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt

      - name: Install Dependencies
        run: |
          pip install -r ./client/data/requirements_for_macos.txt
        shell: bash

      - name: Build .app with Nuitka (app mode)
        working-directory: ./client
        run: |
          python -m nuitka \
            --mode=app \
            --macos-app-name="USB KVM Client" \
            --macos-app-version=1.0.0 \
            --macos-sign-identity=- \
            --python-flag=-u \
            --python-flag=-O \
            --enable-plugin=pyside6 \
            --include-qt-plugins=multimedia \
            --include-data-dir=./data=data \
            --include-data-dir=./icons=icons \
            --include-data-dir=./translations=translations \
            --output-dir=build \
            --assume-yes-for-downloads \
            --quiet \
            usb_kvm_client.py
        shell: bash

      - name: Post-process .app (icon + LSUIElement)
        run: |
          APP_PATH="./client/build/USB KVM Client.app"
          CONTENTS="${APP_PATH}/Contents"
          RESOURCES="${CONTENTS}/Resources"

          # 添加 LSUIElement 避免 HIServices 注册问题
          /usr/libexec/PlistBuddy \
            -c "Add :LSUIElement bool true" \
            "${CONTENTS}/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Set :LSUIElement true" \
            "${CONTENTS}/Info.plist" 2>/dev/null || true

          # 从 splash.png 生成 .icns 图标
          if [ -f "./client/icons/splash.png" ]; then
            ICONSET="/tmp/app.iconset"
            mkdir -p "$ICONSET"
            for s in 16 32 128 256; do
              sips -z $s $s ./client/icons/splash.png \
                --out "${ICONSET}/icon_${s}x${s}.png" 2>/dev/null
            done
            iconutil -c icns "$ICONSET" -o "${RESOURCES}/app.icns" 2>/dev/null && \
              /usr/libexec/PlistBuddy \
                -c "Add :CFBundleIconFile string app.icns" \
                "${CONTENTS}/Info.plist" 2>/dev/null || true
            rm -rf "$ICONSET"
          fi

          echo "App bundle ready:"
          ls -la "${CONTENTS}/MacOS/usb_kvm_client" 2>/dev/null && \
            echo "  Binary: OK" || echo "  Binary: MISSING!"
        shell: bash

      - name: Clear Quarantine & Ad-hoc Sign
        run: |
          APP_PATH="./client/build/USB KVM Client.app"
          xattr -cr "${APP_PATH}" 2>/dev/null || true
          codesign --force --deep --sign - "${APP_PATH}"
          codesign --verify --verbose "${APP_PATH}"
        shell: bash

      - name: Package as DMG
        run: |
          APP_PATH="./client/build/USB KVM Client.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle not found at $APP_PATH"
            exit 1
          fi

          VERSION="${{ github.ref_name }}"
          DMG_NAME="USB_KVM_Client_${VERSION}_macOS_arm64.dmg"
          STAGING_DIR="./dmg_staging"

          mkdir -p dist "$STAGING_DIR"
          cp -R "$APP_PATH" "$STAGING_DIR/"
          ln -sf /Applications "$STAGING_DIR/Applications"

          echo "Creating DMG: ${DMG_NAME}"
          hdiutil create \
            -volname "USB KVM Client" \
            -srcfolder "$STAGING_DIR" \
            -ov \
            -format UDZO \
            -imagekey zlib-level=9 \
            "dist/${DMG_NAME}"

          echo "DMG: dist/${DMG_NAME} ($(du -sh "dist/${DMG_NAME}" | cut -f1))"
        shell: bash

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS_build
          path: dist/*.dmg
          include-hidden-files: true

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./download-artifact

      - name: Display structure of downloaded files
        run: ls -R ./download-artifact

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./download-artifact/**/*.dmg
          tag_name: ${{ github.ref_name }}
          body: "macOS DMG release of ${{ github.ref_name }}."
        env:
          GITHUB_TOKEN: ${{ secrets.PROJECT_TOKEN }}
