name: client_build
"on":
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.14'
            label: linux
          - os: windows-latest
            python: '3.14'
            label: windows
          - os: windows-2019
            python: '3.12'
            label: windows_win7

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check-out repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt
            **/client/data/requirements*.txt

      - name: Install Dependencies
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
              pip install -r ./client/data/requirements_for_posix.txt
          elif [ "$RUNNER_OS" = "Windows" ] && [ "${{ matrix.label }}" = "windows_win7" ]; then
              pip install -r ./client/data/requirements_for_win7.txt
          elif [ "$RUNNER_OS" = "Windows" ]; then
              pip install -r ./client/data/requirements.txt
          else
              echo "$RUNNER_OS not supported"
              exit 1
          fi
        shell: bash

      - name: Build with Nuitka (Windows)
        if: runner.os == 'Windows'
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          working-directory: ./client
          script-name: usb_kvm_client.py
          mode: app
          python-flag: |
            -u
            -O
          include-data-dir: |
            ./data=data
            ./icons=icons
            ./translations=translations
          enable-plugins: pyside6
          include-qt-plugins: multimedia
          # file information
          product-name: usb kvm client
          product-version: 1.0.0.0
          file-description: a open source usb kvm client
          # windows flag
          windows-console-mode: disable
          windows-icon-from-ico: ./icons/main.ico
          onefile-windows-splash-screen-image: ./icons/splash.png
          quiet: true

      - name: Build with Nuitka (Linux)
        if: runner.os == 'Linux'
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          working-directory: ./client
          script-name: usb_kvm_client.py
          mode: app
          python-flag: |
            -u
            -O
          include-data-dir: |
            ./data=data
            ./icons=icons
            ./translations=translations
          enable-plugins: pyside6
          include-qt-plugins: multimedia
          quiet: true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}_build
          path: |
            ./client/build/*.exe
            ./client/build/*.bin
          include-hidden-files: true

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./download-artifact

      - name: Display structure of downloaded files
        run: ls -R ./download-artifact

      - name: Compress to zip file
        run: |
          zip ./download-artifact/usb_kvm_client_for_linux.zip ./download-artifact/linux_build/*.bin -v -1 -j
          zip ./download-artifact/usb_kvm_client_for_windows.zip ./download-artifact/windows_build/*.exe -v -1 -j
          zip ./download-artifact/usb_kvm_client_for_windows_win7.zip ./download-artifact/windows_win7_build/*.exe -v -1 -j || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./download-artifact/*.zip
          tag_name: ${{ github.ref_name }}
          body: "Release of ${{ github.ref_name }}."
        env:
          GITHUB_TOKEN: ${{ secrets.PROJECT_TOKEN }}
